# Gradle daemon के लिए JVM arguments
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX का उपयोग करने के लिए (Jetpack Compose के लिए अनिवार्य)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# AndroidX के लिए non-transitive R classes (build तेज़ और साफ़ रखता है)
android.nonTransitiveRClass=true

# Gradle configuration cache (build को तेज़ करता है)
org.gradle.configuration-cache=false